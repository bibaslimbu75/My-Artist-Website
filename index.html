<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Website</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Background decorative element -->
    <div class="glow-bg"></div>

    <header class="navbar">
        <div class="logo">BKL THE POET</div>
        <nav>
            <a href="#music">Music</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <span class="subtitle">Latest Release Out Now</span>
                <h1>Rhymes & Realities</h1>
                <p>Stream the new tracks across all major digital platforms.</p>
                <div class="cta-buttons">
                    <a href="#music" class="btn btn-primary">Listen Now</a>
                    <a href="#contact" class="btn btn-secondary">Get In Touch</a>
                </div>
            </div>
        </section>

        <!-- Music & Media Section -->
        <section id="music" class="music-section">
            <h2>Featured Audio</h2>
            <div class="music-grid">
                <!-- Cover Art Column -->
                <div class="cover-art">
                    <!-- Replace with your actual cover image path later -->
                    <div class="art-placeholder">
                        <span>COVER ART</span>
                    </div>
                </div>
                <!-- Player/Links Column -->
                <div class="player-container">
                    <h3>Stream Directly</h3>
                    
                    <!-- HTML5 Native Audio Player Example -->
                    <div class="custom-player">
                        <audio controls>
                            <source src="your-audio-file.mp3" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                    </div>

                    <!-- Platform Smart Links -->
                    <div class="platform-links">
                        <a href="#" class="platform-card"><span>YouTube</span> ➔</a>
                        <a href="#" class="platform-card"><span>Spotify</span> ➔</a>
                        <a href="#" class="platform-card"><span>Apple Music</span> ➔</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; BKL THE POET. All rights reserved.</p>
    </footer>

</body>
</html>
